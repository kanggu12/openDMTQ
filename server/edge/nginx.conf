# Edge: the server's one public port, for the game (plain HTTP) and for browsers over HTTPS.
#
# It looks only at the first bytes of each connection. Anything but a TLS handshake goes as it is
# to the server's plain door (8081); a TLS handshake is decrypted here and goes on, as plain HTTP,
# to the server's HTTPS door (8443). The key never leaves this container: the server and its old
# PHP code do not see it. Each hop starts with a PROXY protocol header, so the server still sees
# every visitor's own address (for the sign-in throttles and the logs).
worker_processes 1;
# Room for many visitors: each takes two to four files (both sides of one or two hops).
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

stream {
    # Docker's name server: a re-created server container (new address) is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # One address may hold this many connections at a time: a household of players behind one
    # address needs a few each, and a handful of clients cannot hold all of Apache's 150 workers.
    limit_conn_zone $binary_remote_addr zone=per_address:1m;

    map $ssl_preread_protocol $first_hop {
        # Not a TLS handshake: the game and plain-HTTP browsers.
        "" server:8081;
        default 127.0.0.1:8443;
    }

    server {
        listen 8790;
        limit_conn per_address 24;
        ssl_preread on;
        # A client that connects and says nothing is dropped after this long.
        preread_timeout 15s;
        proxy_pass $first_hop;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # Idle time allowed on a connection; app downloads and admin uploads keep data flowing.
        proxy_timeout 15m;
    }

    # Where HTTPS ends: the visitor's address arrives in the PROXY header from the server above.
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        ssl_certificate /etc/opendmtq/https/server.crt;
        ssl_certificate_key /etc/opendmtq/https/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:tls:1m;
        ssl_session_timeout 1h;
        # A name, so it is looked up when used: the server container may start after this one.
        set $https_door server:8443;
        proxy_pass $https_door;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 15m;
    }
}
