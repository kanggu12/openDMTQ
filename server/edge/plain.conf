# Edge without a certificate (see nginx.conf): every connection goes to the server's plain door,
# with the visitor's address in a PROXY protocol header. A TLS handshake gets no answer it can use.
worker_processes 1;
# Room for many visitors: each takes two to four files (both sides of one or two hops).
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    # One address may hold this many connections at a time: a household of players behind one
    # address needs a few each, and a handful of clients cannot hold all of Apache's 150 workers.
    limit_conn_zone $binary_remote_addr zone=per_address:1m;

    server {
        listen 8790;
        limit_conn per_address 24;
        set $plain_door server:8081;
        proxy_pass $plain_door;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 15m;
    }
}
