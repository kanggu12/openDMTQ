; PHP settings for the OpenDMTQ backend.

; Never print warnings into responses: the game parses them as JSON and fails.
display_errors = Off
display_startup_errors = Off
; Send them to the container log instead.
log_errors = On
error_log = /dev/stderr
; Output buffering, so header() still works after a stray warning.
output_buffering = 4096
; The backend only uses epoch time; set a zone so PHP does not warn about it. entrypoint.sh replaces
; it with TZ when that names a zone PHP knows (the in-game ranking's day then follows the server's).
date.timezone = UTC
; Never advertise the PHP version.
expose_php = Off

; Compile each script once per container start; the code never changes while running.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
