# The OpenDMTQ site, included by each of the server's doors (opendmtq.conf). The game used four
# hosts; the patched client sends all of them to one address, where their paths do not collide.
# Files (songs, charts, jackets, the client's tables) come from the admin's overlay or the imported
# content; every other request of the game, its platform SDK and its window goes to the game server.
# The folders are named by environment variables (the image sets them; a host install's start script
# does), so this one file serves every kind of install. Each is quoted: on Windows a folder's name may hold a
# space (a user's own folder), which would split it in two.
DocumentRoot "${OPENDMTQ_APP}/game/public"

# The portal and the game server read the address and the folders the server was started with.
PassEnv PUBLIC_HOST ROLE ADMIN_URL ADMIN_ON_PUBLIC_PORT OPENDMTQ_CONTENT OPENDMTQ_CUSTOM OPENDMTQ_DB OPENDMTQ_STATE

RewriteEngine On
# Files added through the admin pages (added songs, rebuilt tables, the maintenance notice) live in a
# writable overlay and win over the imported content when both have the same path.
RewriteCond "${OPENDMTQ_CUSTOM}/web%{REQUEST_URI}" -f
RewriteRule "^/((?:DMQ/(?:Songs|Patterns)|viewImg|patch|static|inspection)/.+)$" "${OPENDMTQ_CUSTOM}/web/$1" [L]
# The imported content: what the operator brought (./opendmtq import), served as it is.
RewriteCond "${OPENDMTQ_CONTENT}/web%{REQUEST_URI}" -f
RewriteRule "^/((?:DMQ/(?:Songs|Patterns)|viewImg|patch|static)/.+)$" "${OPENDMTQ_CONTENT}/web/$1" [L]
# Everything else of the game, the SDK and the game's window: the game server (game/index.php).
RewriteRule "^/(?:DMQ/rpc(?:\.php)?(?:/.*)?|api/.+|accounts/.+|apps/.+|members(?:/.*)?|product/.+|inspection/status\.json|www/mobile/help(?:\.php)?|score(?:/.*)?|djmaxQ(?:/.*)?)$" "${OPENDMTQ_APP}/game/index.php" [L]

# The live view's endpoints for the phone, each named outright: the limits below then see the address
# the phone used.
AliasMatch "^/live/(state|upload|end)$" "${OPENDMTQ_APP}/game/live/$1.php"
# One video segment at most (LIVE_MAX_BODY in portal/live_lib.php), for this address alone; the other
# two carry no body.
<LocationMatch "^/live/upload(?:\.php)?$">
    LimitRequestBody 4194304
</LocationMatch>
<LocationMatch "^/live/(?:state|end)(?:\.php)?$">
    LimitRequestBody 8192
</LocationMatch>

# OpenDMTQ's own pages: the portal, and the APK download a phone browser opens.
Alias /opendmtq "${OPENDMTQ_APP}/portal"
# Small jackets for the web pages, made by the admin service.
Alias /thumbs "${OPENDMTQ_CUSTOM}/thumbs"
Alias /apk "${OPENDMTQ_APP}/portal/apk.php"
# The PC client's installer, set up for this server, which a computer's browser downloads.
Alias /windows "${OPENDMTQ_APP}/portal/windows.php"
# A bare visit (a phone checking it can reach the server) lands on the portal.
RedirectMatch 302 "^/$" "/opendmtq/"
# An address that leads nowhere gets the portal's page with the way home (still a 404). The game's
# own paths keep Apache's short answer: the client only reads the status, and a missing asset
# should not cost a PHP run.
ErrorDocument 404 /opendmtq/notfound.php
<LocationMatch "^/(?:DMQ|djmaxQ|live|patch|score|static|viewImg|www|api|accounts|apps|members|product|inspection|thumbs)/">
    ErrorDocument 404 default
</LocationMatch>
# The page is for people: a request that does not ask for HTML (an image, a script, the scanners
# that probe every server for known files) gets the short answer, without running PHP.
<If "%{HTTP_ACCEPT} !~ m#text/html#">
    ErrorDocument 404 default
</If>
# Browsers ask for /favicon.ico wherever a page names no icon (the status JSON, a downloaded file):
# the site's icon instead of a 404.
Alias /favicon.ico "${OPENDMTQ_APP}/portal/favicon.svg"
<Location "/favicon.ico">
    ForceType image/svg+xml
</Location>
# Crawlers stay out of this private server (portal/robots.txt); allowed past the deny list below.
Alias /robots.txt "${OPENDMTQ_APP}/portal/robots.txt"

<Directory "${OPENDMTQ_APP}/game">
    Options None
    AllowOverride None
    Require all granted
    # Only the front door and the live view's endpoints are requests; the rest is what they load.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(?:index|state|upload|end)\.php$">
        Require all granted
    </FilesMatch>
</Directory>

<Directory "${OPENDMTQ_CONTENT}/web">
    Options None
    AllowOverride None
    Require all granted
</Directory>

<Directory "${OPENDMTQ_CUSTOM}/thumbs">
    Options None
    AllowOverride None
    Require all granted
    ExpiresActive On
    ExpiresDefault "access plus 7 days"
</Directory>

<Directory "${OPENDMTQ_CUSTOM}/web">
    Options None
    AllowOverride None
    Require all granted
</Directory>

<Directory "${OPENDMTQ_APP}/portal">
    Options None
    AllowOverride None
    Require all granted
    # What the pages load, never pages of their own.
    <FilesMatch "^(?:lib|live_lib|auth|strings)\.php$">
        Require all denied
    </FilesMatch>
</Directory>

# The server's own certificate authority (data/https), for phones that want HTTPS without the
# browser warning. Nothing else in that folder is ever served: the server's key is there too.
Alias /ca.crt "${OPENDMTQ_HTTPS}/ca.crt"
<Directory "${OPENDMTQ_HTTPS}">
    Options None
    AllowOverride None
    Require all denied
    <Files "ca.crt">
        Require all granted
        ForceType application/x-x509-ca-cert
    </Files>
</Directory>

# Never served: notes, backups and databases, wherever someone may have left one in a served folder.
<LocationMatch "\.(?:txt|bak|db3|log|md)$|\.ht(?:access|passwd)$">
    Require all denied
</LocationMatch>
# The one text file that is served: OpenDMTQ's own robots.txt (a later section wins).
<Location "/robots.txt">
    Require all granted
</Location>

# Game RPC and platform replies are JSON or HTML text: compress them for slow Wi-Fi.
AddOutputFilterByType DEFLATE application/json text/html text/plain text/css application/javascript

# A compressed reply's ETag carries -gzip, which Apache does not recognise when the browser sends it
# back, so the stylesheet came whole with every page instead of a 304. Compared without it as well.
RequestHeader edit "If-None-Match" "^\"(.*)-gzip\"$" "\"$1-gzip\", \"$1\""

# Songs, patterns, previews and jackets never change for a given name (added songs never reuse an
# id): let clients cache them. The patch manifest and tables change when songs are added.
<LocationMatch "^/(?:DMQ/(?:Songs|Patterns)|viewImg|patch/.*/(?:preview|dlc|Fonts))/">
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
    Header append Cache-Control "immutable"
</LocationMatch>

# The player's file has its version in its name, so it never changes either.
<LocationMatch "^/opendmtq/hls/hls-[0-9.]+\.min\.js$">
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
    Header append Cache-Control "immutable"
</LocationMatch>

<LocationMatch "^/patch/.*/(?:patch_new\.csv\.lz4|table/)">
    Header set Cache-Control "no-cache"
</LocationMatch>
