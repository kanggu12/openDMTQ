{{- if and (or .Values.litestream.enabled .Values.objectStore.enabled) (not .Values.litestream.s3.existingSecret) }}
{{- /* Credentials for the database replica; generated once for the bundled store and kept on upgrade. */}}
{{- $name := include "opendmtq.s3Secret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.litestream.s3.accessKeyId | default .Values.objectStore.accessKeyId }}
{{- $secret := .Values.litestream.s3.secretAccessKey | default .Values.objectStore.secretAccessKey }}
{{- if and (not $secret) $old }}{{ $secret = index $old.data "LITESTREAM_SECRET_ACCESS_KEY" | b64dec }}{{ end }}
{{- if not .Values.objectStore.enabled }}
{{- /* External storage: its keys cannot be invented. */}}
{{- $key = required "litestream.s3.accessKeyId (or litestream.s3.existingSecret) is required for external object storage" .Values.litestream.s3.accessKeyId }}
{{- $secret = required "litestream.s3.secretAccessKey (or litestream.s3.existingSecret) is required for external object storage" .Values.litestream.s3.secretAccessKey }}
{{- end }}
{{- if not $secret }}{{ $secret = randAlphaNum 32 }}{{ end }}
{{- if and .Values.objectStore.enabled (not (regexMatch "^[A-Za-z0-9._+/=-]+$" (printf "%s%s" $key $secret))) }}
{{- fail "objectStore credentials may only contain letters, digits and . _ + / = -" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "opendmtq.labels" (dict "ctx" $ "component" "storage") | nindent 4 }}
type: Opaque
stringData:
  LITESTREAM_ACCESS_KEY_ID: {{ $key | quote }}
  LITESTREAM_SECRET_ACCESS_KEY: {{ $secret | quote }}
{{- end }}
