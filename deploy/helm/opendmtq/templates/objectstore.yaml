{{- if .Values.objectStore.enabled }}
{{- $full := include "opendmtq.fullname" . }}
# The bundled SeaweedFS S3, one pod. Its data survives pod restarts (PVC), not node loss.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $full }}-s3
  labels: {{- include "opendmtq.labels" (dict "ctx" $ "component" "storage") | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.objectStore.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.objectStore.persistence.size }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-s3
  labels: {{- include "opendmtq.labels" (dict "ctx" $ "component" "storage") | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "opendmtq.selector" (dict "ctx" $ "component" "storage") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "opendmtq.selector" (dict "ctx" $ "component" "storage") | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: false
      {{- with .Values.objectStore.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.objectStore.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Write the S3 identity file from the credentials secret (SeaweedFS reads no environment).
        - name: config
          image: {{ include "opendmtq.image" (dict "img" .Values.objectStore.image "ctx" $) }}
          command:
            - sh
            - -c
            - >-
              printf '{"identities":[{"name":"opendmtq","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
              "$LITESTREAM_ACCESS_KEY_ID" "$LITESTREAM_SECRET_ACCESS_KEY" > /cfg/s3.json
          envFrom: [{secretRef: {name: {{ include "opendmtq.s3Secret" . }}}}]
          {{- include "opendmtq.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: config, mountPath: /cfg}
      containers:
        - name: seaweedfs
          image: {{ include "opendmtq.image" (dict "img" .Values.objectStore.image "ctx" $) }}
          args: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=256",
                 "-volume.max=8", "-s3", "-s3.port=8333", "-s3.config=/cfg/s3.json"]
          ports: [{name: s3, containerPort: 8333}, {name: filer, containerPort: 8888}]
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          lifecycle:
            postStart:
              exec:
                # The replica bucket must exist before Litestream writes to it.
                command: ["sh", "-c", "for i in $(seq 1 60); do echo 's3.bucket.create -name {{ .Values.litestream.s3.bucket }}' | weed shell -master=127.0.0.1:9333 2>&1 | grep -qiE 'created|exist' && exit 0; sleep 2; done; exit 1"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          {{- include "opendmtq.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /cfg}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ $full }}-s3}
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-s3
  labels: {{- include "opendmtq.labels" (dict "ctx" $ "component" "storage") | nindent 4 }}
spec:
  selector: {{- include "opendmtq.selector" (dict "ctx" $ "component" "storage") | nindent 4 }}
  ports: [{name: s3, port: 8333, targetPort: s3}]
{{- end }}
