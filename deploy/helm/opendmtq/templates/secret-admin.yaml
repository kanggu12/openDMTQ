{{- if and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- /* Admin password, generated once and kept on upgrade. */}}
{{- $name := printf "%s-admin" (include "opendmtq.fullname" .) }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "opendmtq.labels" (dict "ctx" $ "component" "admin") | nindent 4 }}
type: Opaque
data:
  ADMIN_PASSWORD: {{ if $old }}{{ index $old.data "ADMIN_PASSWORD" }}{{ else }}{{ randAlphaNum 16 | b64enc }}{{ end }}
{{- end }}
