name: release

# Push a tag like v1.2.3 to publish images to GHCR, the Helm chart as an OCI artifact, and a
# GitHub release.
on:
  push:
    tags: ["v*"]
  # A rehearsal, on any commit: all the gates, and nothing published (gh workflow run release.yml).
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # To read the local gate's status on the commit: naming any permission here takes away those not named.
  statuses: read

jobs:
  # All of CI, again, on the tag's commit.
  ci:
    uses: ./.github/workflows/ci.yml

  # What CI cannot run, as it needs the game's files: tests/qa.sh on a machine that has them, which leaves this status on the
  # commit when everything passed.
  qa:
    runs-on: ubuntu-24.04
    # A stalled download fails after 10 minutes, not GitHub's six hours: several times what this job takes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # One version in the tag, the chart and CHANGELOG.md, and notes for it: checked first, so that nothing is built
      # or published under a number the chart does not carry, or without notes. A rehearsal on a branch has no tag:
      # it checks the chart's own version against CHANGELOG.md.
      - name: The tag, the chart and CHANGELOG.md name one version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          else
            version=v$(sed -n 's/^version: *//p' deploy/helm/opendmtq/Chart.yaml)
          fi
          python3 .github/release_notes.py "$version"
      - name: The local quality gate passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" --jq '[.statuses[] | select(.context == "qa/local")][0].state')
          echo "qa/local: ${state:-none}"
          if [ "$state" != success ]; then
            echo "::error::tests/qa.sh has not passed on this commit; run it on a machine with the game's files, then tag again"
            exit 1
          fi

  publish:
    needs: [ci, qa]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # A stalled download fails after 60 minutes, not GitHub's six hours: several times what this job takes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime for newer phones, whole, licenses included: with the release, for a server that fetches it; in the tools
      # image, beside the code that looks for it, and so in the builder that adds it to the app, on a cluster or a server
      # without internet too; and in the Windows bundle below (tools/opendmtq_tools/runtime.py).
      # The NDK CI tests with, not the runner's own, which moves with the runner's image: the zip's hash would move too, and every
      # server would build its app again for nothing.
      - name: The runtime for newer phones
        env:
          ANDROID_NDK: ""
          ANDROID_HOME: /nonexistent
        run: |
          arm32/bundle.sh data/apk/arm32
          mkdir -p dist
          python3 tools/opendmtq_tools/runtime.py --pack data/apk/arm32 dist/opendmtq-arm32-runtime.zip
          cp dist/opendmtq-arm32-runtime.zip tools/opendmtq_tools/

      # The player for Windows without an app: what the PC client's installer carries below, and with the release for the
      # servers of 0.6 and 0.7, which fetch it. It is built from the same guest system and Dynarmic as the runtime above,
      # and its Java VM against the same NDK's jni.h (arm32/ndk.sh's jni_headers).
      - name: The player for Windows
        env:
          ANDROID_NDK: ""
          ANDROID_HOME: /nonexistent
        run: |
          arm32/build_windows.sh player
          arm32/bundle_windows.sh dist/opendmtq-player-windows.zip

      # The PC client: its installer, OpenDMTQ-Setup.exe, with the release for players and for servers that fetch it, and in
      # the tools image and the Windows bundle beside the code that hands it out set up for each server
      # (tools/opendmtq_tools/windows_client.py), with its version; and Velopack's packages, from which installed clients
      # update themselves (this repository's releases).
      - name: The PC client
        env:
          OPENDMTQ_UPDATE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          PLAYER_ZIP: dist/opendmtq-player-windows.zip
        run: |
          client/packaging/windows/build.sh _work/client-release
          mkdir -p dist/client
          cp _work/client-release/releases/* dist/client/
          cp _work/client-release/releases/OpenDMTQ-Setup.exe _work/client-release/releases/OpenDMTQ-Setup.exe.version tools/opendmtq_tools/

      # The Windows bundle for this version, and its SHA-256, with the release. Before anything is pushed: its downloads are the
      # likeliest thing to fail (some sites drop old files), and a failure here must not leave half a release published.
      - name: Windows bundle
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          host/windows/build.sh _work/windows
          cp _work/windows/OpenDMTQ-windows.zip _work/windows/OpenDMTQ-windows.zip.sha256 dist/

      - name: Server image (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/opendmtq-server:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.registry }}/opendmtq-server:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The release's number in the image, for the version its pages show when it runs on its own (docker run).
          build-args: OPENDMTQ_VERSION=${{ steps.names.outputs.version }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Tools image (amd64; the bundled 7-Zip build is x86-64)
        uses: docker/build-push-action@v7
        with:
          context: tools
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/opendmtq-tools:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.registry }}/opendmtq-tools:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The release's number in the image, for the version its pages show when it runs on its own (docker run).
          build-args: OPENDMTQ_VERSION=${{ steps.names.outputs.version }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Helm chart
        run: |
          helm package deploy/helm/opendmtq --version "${{ steps.names.outputs.version }}" \
            --app-version "${{ steps.names.outputs.version }}" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/opendmtq-*.tgz "oci://${{ steps.names.outputs.registry }}/charts"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The notes are this version's section of CHANGELOG.md; --generate-notes adds the compare link under them.
        run: |
          python3 .github/release_notes.py "$GITHUB_REF_NAME" > dist/release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/opendmtq-*.tgz dist/opendmtq-arm32-runtime.zip dist/opendmtq-player-windows.zip \
            dist/OpenDMTQ-windows.zip dist/OpenDMTQ-windows.zip.sha256 dist/client/* \
            --notes-file dist/release-notes.md --generate-notes --verify-tag
