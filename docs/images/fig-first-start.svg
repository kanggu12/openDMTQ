<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 956 759" width="956" height="759" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="A phone's first start: the app asks for the server's information and the patch manifest, downloads the client's files it lacks, logs in on the platform and in the game, gets the start batch, and registers for push; a song's files come when a player first picks it">
