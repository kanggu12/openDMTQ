<text x="28" y="208" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,172">the runtime for</text>
<text x="28" y="225.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,172">64-bit-only phones,</text>
<text x="28" y="243" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,172">and the live view's</text>
<text x="28" y="260.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="28,172">capture</text>
