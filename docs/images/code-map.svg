<text x="284" y="91.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="284,456">the one public port</text>
<text x="284" y="109" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="284,456">(nginx, with Docker)</text>
<path d="M270,184 H458 L470,196 V284 H270 Z" fill="#1a1f25" stroke="#3a434d" stroke-width="1" stroke-linejoin="round"/>
