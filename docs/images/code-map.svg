<path d="M506.5,410 L572,410" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M579,410 L570.0,414.5 L570.0,405.5 Z" fill="#7b8794" data-tip="579,410"/>
<path d="M0,562 H888 L900,574 V620 H0 Z" fill="#1a1f25" stroke="#3a434d" stroke-width="1" stroke-linejoin="round"/>
<text x="14" y="586.25" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="14,886">opendmtq, cli/ and host/</text>
<text x="14" y="605.25" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="14,886">the command line runs these tools, with Docker (cli/) or without containers (host/, and OpenDMTQ.exe on Windows)</text>
