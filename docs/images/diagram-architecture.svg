<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 956 720" width="956" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="How OpenDMTQ fits together. Android phones run the game in the app the server builds, on 64-bit-only phones too, and send the game's requests, its downloads and broadcasts. Windows PCs do the same through the player, and the launcher signs in and gets the app. Browsers open the site, live video, the admin pages and their API. Everything reaches the server's one public port, where Apache's site.conf sends each path to its part: the game server (/DMQ/rpc and the SDK's paths: logins, scores, rankings, saves), the game's files (/DMQ/Songs, /patch and /viewImg: what phones download), live (/live/: broadcast uploads, kept as recordings), the players' site (/opendmtq/, /apk and /windows: rankings, songs, the live view, the app and the PC installer) and the admin pages (/opendmtq/admin and /opendmtq/api: setup, songs, players, backups and the API). The parts keep their data in data/: the SQLite database of accounts and scores, the imported files, the apps and the recordings. The setup imports the owner's own copy of the game's files, which are not in this repository, and the app builder patches the owner's APK for this server and signs it at every start, with the PC client's installer beside it">
