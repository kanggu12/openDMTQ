<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 956 576" width="956" height="576" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="The Helm chart. Phones and browsers reach the router Service on publicHost; two routers send the game's files to the asset servers (two to N, files only) and the rest to the api pod, exactly one: its init containers, the server, the admin sidecar and Litestream, which copies every commit to S3-compatible storage and restores the newest copy at start. A ReadWriteMany data volume holds content, the apps, the added songs and backups; the builder Job writes the app after install and upgrade">
