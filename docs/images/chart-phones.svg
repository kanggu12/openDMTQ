<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 956 318" width="956" height="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="A 32-bit game at 120 frames a second on a Galaxy S26 Ultra, a phone with no 32-bit support. Of each frame's 8.3 milliseconds the game's thread works 1.4 and waits 6.9. No frame was late in a song: 0 of 237 frames per two seconds, with and without a live broadcast. A broadcast takes the processor from 125 percent of one core to 130 to 133 percent">
<rect x="-28" y="-28" width="956" height="318" rx="16" fill="#11151a"/>
<text x="0" y="18" font-size="19" font-weight="700" fill="#eef2f6" text-anchor="start" data-box="0,900">A 32-bit game at 120 fps, on a phone that has no 32-bit</text>
<text x="0" y="42" font-size="13" fill="#aeb8c3" text-anchor="start" data-box="0,900">One song on a Galaxy S26 Ultra, through OpenDMTQ's arm32 runtime.</text>
<text x="0" y="80" font-size="13.5" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="0,900">Each frame has 8.3 ms</text>
<rect x="0" y="92" width="150.8" height="28" rx="4" fill="#8cf23d"/>
<rect x="152.8" y="92" width="747.2" height="28" rx="4" fill="#55606c"/>
<text x="10" y="111" font-size="12.5" font-weight="700" fill="#0d1114" text-anchor="start" data-box="0,151.807">1.4 ms of work</text>
<text x="163.807" y="111" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start" data-box="151.807,900">6.9 ms with nothing left to do</text>
<text x="0" y="158" font-size="13.5" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="0,900">Frames late</text>
<text x="0" y="196" font-size="34" font-weight="800" fill="#8cf23d" text-anchor="start" data-box="0,40">0</text>
<text x="30" y="182" font-size="13" fill="#eef2f6" text-anchor="start" data-box="30,290">of 237 frames per two seconds</text>
<text x="30" y="199" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="30,290">with and without a live broadcast</text>
<text x="320" y="158" font-size="13.5" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="320,900">Processor during a song (100 % is one core)</text>
<text x="320" y="186" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="320,470">Playing</text>
<path d="M470.0,172.0 H766.0 Q770.0,172.0 770.0,176.0 V186.0 Q770.0,190.0 766.0,190.0 H470.0 Z" fill="#55606c"/>
<text x="778" y="186" font-size="12.5" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="470,900">125 %</text>
<text x="320" y="216" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="320,470">Playing and on air</text>
<path d="M470.0,202.0 H785.2 Q789.2,202.0 789.2,206.0 V216.0 Q789.2,220.0 785.2,220.0 H470.0 Z" fill="#8cf23d"/>
<text x="797.2" y="216" font-size="12.5" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="470,900">130 to 133 %</text>
<text x="0" y="250" font-size="11.5" fill="#8b96a2" text-anchor="start" data-box="0,900">A frame's work is the time between two frames less what the game's own limiter sleeps. 99.8 % of the frames came one refresh apart.</text>
</svg>
