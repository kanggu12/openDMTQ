<text x="700" y="205.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="700,872">the site and</text>
<text x="700" y="223" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="700,872">the download</text>
<path d="M554,110.5 L554,152" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M554,159 L549.5,150.0 L558.5,150.0 Z" fill="#7b8794" data-tip="554,159"/>
<text x="562" y="140" font-size="12" fill="#aeb8c3" text-anchor="start" data-box="558,680">not TLS</text>
