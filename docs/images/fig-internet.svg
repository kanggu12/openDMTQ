<text x="242" y="208" font-size="12" fill="#aeb8c3" text-anchor="start" data-box="240,340">HTTPS</text>
<rect x="440" y="0" width="460" height="470" rx="8" fill="#11151a" stroke="#3a434d" stroke-width="1" stroke-dasharray="5 4"/>
<text x="454" y="22" font-size="13" font-weight="600" fill="#aeb8c3" text-anchor="start" data-box="454,886">Server PC, after ./opendmtq expose</text>
