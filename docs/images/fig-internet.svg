<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -28 956 526" width="956" height="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif" role="img" aria-label="Playing from outside: a phone on mobile data and a browser look up the DDNS name, which follows your public IP, and connect to your router, which forwards TCP 8790 to the server PC. There the edge, the one public port, reads each connection's first bytes: plain HTTP goes to the plain door (the game, /apk, /ca.crt), TLS is ended and goes to the HTTPS door (the site and the download). The admin pages answer there only after expose --admin-public">
<rect x="-28" y="-28" width="956" height="526" rx="16" fill="#11151a"/>
<path d="M0,30 H224 L236,42 V110 H0 Z" fill="#1a1f25" stroke="#3a434d" stroke-width="1" stroke-linejoin="round"/>
