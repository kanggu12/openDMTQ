<text x="14" y="75.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="14,222">on mobile data, the app</text>
<text x="14" y="93" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="14,222">for myhome.example.com:8790</text>
<path d="M0,150 H224 L236,162 V230 H0 Z" fill="#1a1f25" stroke="#3a434d" stroke-width="1" stroke-linejoin="round"/>
<text x="14" y="176.5" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="14,222">Browser outside</text>
<text x="14" y="195.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="14,222">https://myhome</text>
<text x="14" y="213" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="14,222">.example.com:8790/</text>
<path d="M0,330 H224 L236,342 V410 H0 Z" fill="#1a1f25" stroke="#3a434d" stroke-width="1" stroke-linejoin="round"/>
<text x="14" y="365.25" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="14,222">DDNS name</text>
<text x="14" y="384.25" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="14,222">follows your public IP</text>
<path d="M118,230.5 L118,322" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M118,329 L113.5,320.0 L122.5,320.0 Z" fill="#7b8794" data-tip="118,329"/>
<text x="126" y="284" font-size="12" fill="#aeb8c3" text-anchor="start" data-box="124,232">both look it up</text>
