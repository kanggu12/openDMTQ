<text x="290" y="116.5" font-size="15" font-weight="600" fill="#eef2f6" text-anchor="start" data-box="290,412">Router</text>
<text x="290" y="135.5" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="290,412">forwards TCP 8790</text>
<text x="290" y="153" font-size="12.5" fill="#aeb8c3" text-anchor="start" data-box="290,412">to the server PC</text>
<path d="M236.5,70 L256,70 L256,120 L268,120" fill="none" stroke="#7b8794" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M275,120 L266.0,124.5 L266.0,115.5 Z" fill="#7b8794" data-tip="275,120"/>
